name: Deploy with Docker Compose

on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. latest, sha-xxxxxxx, v1.0.0)"
        required: false
        default: "latest"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Prepare docker-compose.yml
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          cat > docker-compose.deploy.yml <<EOF
          services:
            matrix-ics-bot:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
              container_name: matrix-ics-bot
              restart: unless-stopped
              environment:
                - NODE_ENV=production
              volumes:
                - ./config:/data/config:ro
                - ./storage:/app/storage
          EOF
          echo "COMPOSE_B64=$(base64 -w0 docker-compose.deploy.yml)" >> "$GITHUB_ENV"

      - name: Pull and restart container
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: COMPOSE_B64
          script: |
            set -e
            APP_DIR=/opt/matrix-ics-bot
            mkdir -p "$APP_DIR/config" "$APP_DIR/storage"
            echo "$COMPOSE_B64" | base64 -d > "$APP_DIR/docker-compose.yml"
            cd "$APP_DIR"
            docker compose pull
            docker compose up -d
            docker image prune -f
